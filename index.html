<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一封给王荣凤的信</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9f6f2;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  .hint {
    position: fixed;
    bottom: 40px;
    color: #b0a89f;
    font-size: 14px;
    animation: pulse 2s ease-in-out infinite;
    z-index: 5;
    transition: opacity 0.3s;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  .envelope-wrapper {
    position: relative;
    cursor: pointer;
    width: 340px;
    height: 240px;
    transition: transform 0.3s ease, opacity 0.5s ease;
    z-index: 2;
  }
  .envelope-wrapper:hover {
    transform: translateY(-5px);
  }

  .envelope-wrapper.hidden {
    transform: scale(0.8);
    opacity: 0;
    pointer-events: none;
  }
  .hint.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .pocket {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
    background: #e8d5c4;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    z-index: 3;
    overflow: hidden;
  }
  .pocket::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid #d4bfae;
    border-right: 170px solid #d4bfae;
    border-bottom: 110px solid transparent;
    z-index: 1;
  }
  .pocket::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid transparent;
    border-right: 170px solid transparent;
    border-bottom: 100px solid #e1ccb8;
    z-index: 2;
  }

  .flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 120px;
    transform-origin: top center;
    z-index: 4;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .flap-side {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid #c9ad96;
    border-right: 170px solid #c9ad96;
    border-bottom: 120px solid transparent;
    z-index: 0;
  }
  .flap-top {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid transparent;
    border-right: 170px solid transparent;
    border-top: 120px solid #bfa085;
    z-index: 1;
  }

  .envelope-wrapper.is-opening .flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  .seal {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    background: radial-gradient(circle at 35% 35%, #d45454, #a33);
    border-radius: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: rgba(255,255,255,0.9);
    box-shadow: 0 2px 10px rgba(163, 51, 51, 0.4);
    transition: opacity 0.3s ease;
  }
  .envelope-wrapper.is-opening .seal {
    opacity: 0;
  }

  .content-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(249, 246, 242, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .content-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .content-card {
    width: 100%;
    max-width: 650px;
    max-height: 80vh;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.12);
    padding: 60px 50px;
    overflow-y: auto;
    transform: translateY(50px) scale(0.95);
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .content-card::-webkit-scrollbar {
    display: none;
  }

  .content-overlay.active .content-card {
    transform: translateY(0) scale(1);
  }

  .text-content {
    font-family: "Songti SC", "SimSun", "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.9;
    color: #4a4a4a;
    letter-spacing: 0.8px;
    text-align: justify;
  }
  .text-content .greeting {
    font-size: 24px;
    font-weight: bold;
    color: #2a2a2a;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px dashed #e0e0e0;
    text-align: left;
  }
  .text-content p {
    margin-bottom: 25px;
    text-indent: 2em;
  }
  .text-content .signature {
    text-align: right;
    margin-top: 50px;
    color: #999;
    font-style: italic;
    text-indent: 0;
  }

  .close-btn {
    position: absolute;
    top: 40px;
    right: 40px;
    width: 50px;
    height: 50px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    border: none;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #999;
    transform: scale(0.8) rotate(-90deg);
    opacity: 0;
    transition: all 0.3s ease;
  }
  .close-btn:hover {
    background: #f0f0f0;
    color: #555;
    transform: scale(1) rotate(0deg) !important;
  }
  .content-overlay.active .close-btn {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }

  .hearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .heart {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    animation: float-up 5s ease-in-out infinite;
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translateY(100px) scale(0.5) rotate(0deg); }
    30% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-200px) scale(1) rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <div class="envelope-wrapper" id="envelope" onclick="openLetter()">
    <div class="seal">♥</div>
    <div class="flap">
      <div class="flap-side"></div>
      <div class="flap-top"></div>
    </div>
    <div class="pocket"></div>
  </div>

  <div class="hint" id="hint">点击信封，展开阅读</div>

  <div class="content-overlay" id="contentOverlay" onclick="handleOverlayClick(event)">
    <button class="close-btn" onclick="closeLetter()" title="关闭">✕</button>
    <div class="content-card">
      <div class="text-content">
        <div class="greeting">to：王荣凤</div>
        
        <p>和你认识真的很开心，因为我感觉你人真的很好（虽然我知道你应该还是有另一面的）。</p>
        
        <p>我常常会不开心，你都会愿意听我诉说和诉苦。虽然你说你不是好人，但在我这，那就是最好的。</p>
        
        <p>然后你也说我好，因为我感觉你值得我这样对你。</p>
        
        <p>其实我知道我这样天天不开心就找你诉苦不大好，也知道我在你这形象不大好，有点像一个小孩子。但我在别人那不是这样的</p>
        
        <p>但在你这，做一个可以哭的小孩，挺好的。</p>
        
        <p>但我也是有不像小孩的一面的，平常我可能嘻嘻哈哈，但也是会认真做事的。</p>
        
        <div class="signature">—— 小马</div>
      </div>
    </div>
  </div>

<script>
  function openLetter() {
    const envelope = document.getElementById('envelope');
    const overlay = document.getElementById('contentOverlay');
    const hint = document.getElementById('hint');
    envelope.classList.add('is-opening');
    hint.classList.add('hidden');
    setTimeout(() => {
      envelope.classList.add('hidden');
      overlay.classList.add('active');
    }, 600);
  }

  function closeLetter() {
    const envelope = document.getElementById('envelope');
    const overlay = document.getElementById('contentOverlay');
    const hint = document.getElementById('hint');
    overlay.classList.remove('active');
    setTimeout(() => {
      envelope.classList.remove('hidden');
      envelope.classList.remove('is-opening');
      hint.classList.remove('hidden');
    }, 400);
  }

  function handleOverlayClick(event) {
    if (event.target.id === 'contentOverlay') {
      closeLetter();
    }
  }

  // 随机生成背景装饰（密度已调高）
  const container = document.getElementById('hearts');
  const symbols = ['♥', '❤', '✨', '💫', '💕'];
  setInterval(() => {
    if(document.hidden) return;
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.bottom = '-50px';
    h.style.animationDuration = (4 + Math.random() * 2) + 's';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.color = ['#ffb6c1', '#ffd700', '#87ceeb', '#ffb347', '#d3d3d3'][Math.floor(Math.random()*5)];
    container.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }, 150);
</script>
</body>
</html>
